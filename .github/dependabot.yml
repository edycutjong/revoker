version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Major bumps are migrations, not maintenance. They break CI on a frozen
      # submission and must be a deliberate, separate piece of work.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Same rule as npm above, and for the same reason. A major action bump is
      # a migration — checkout v4 -> v7 changes runner and input behaviour — and
      # it lands as one grouped PR touching every workflow at once. Security
      # patches still arrive via minor/patch; majors are a deliberate, separate
      # piece of work, not something to take days before a submission freeze.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
