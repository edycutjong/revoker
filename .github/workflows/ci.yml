name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A pushed-over run is wasted compute; cancel it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality — lint · types · unit tests
    runs-on: ubuntu-latest
    # Runs after the secret scan: if a credential is in the history, the right
    # response is to stop and rotate it, not to keep testing.
    needs: [security]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests with coverage
        run: pnpm test:coverage

      # Put the numbers on the run page. An artifact is where coverage goes to
      # be ignored; the job summary is the first thing anyone actually reads.
      - name: Coverage summary
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          f = pathlib.Path('coverage/coverage-summary.json')
          if not f.exists():
              print('Coverage summary not produced.'); raise SystemExit(0)
          d = json.loads(f.read_text())
          tot = d.pop('total')
          print('## TypeScript coverage\n')
          print('| metric | % | covered / total |')
          print('|---|---|---|')
          for m in ('statements', 'branches', 'functions', 'lines'):
              v = tot[m]
              print(f"| {m} | **{v['pct']}%** | {v['covered']} / {v['total']} |")
          rows = sorted((k, v) for k, v in d.items() if '/src/' in k)
          if rows:
              print('\n<details><summary>Per file (src/)</summary>\n')
              print('| file | stmts | branch | funcs |')
              print('|---|---|---|---|')
              for k, v in rows:
                  print(f"| `{k.split('/src/')[-1]}` | {v['statements']['pct']}% "
                        f"| {v['branches']['pct']}% | {v['functions']['pct']}% |")
              print('\n</details>')
          PY

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  security:
    name: Security — dependencies · secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the secret scan can see every commit, not just HEAD.
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level=high

      - name: Scan git history for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Assert no credentials are committed
        run: bash scripts/check-no-credentials.sh

  contracts:
    name: Contracts — build · test · fuzz
    runs-on: ubuntu-latest
    # Gated on quality because it is the cheapest signal and shares the same
    # dependency install. A broken lockfile or a type error would otherwise fail
    # here too, three minutes later and less legibly.
    needs: [quality]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1

      - name: Install forge-std
        working-directory: contracts
        run: forge install foundry-rs/forge-std --no-git

      - name: Build
        working-directory: contracts
        run: forge build --sizes

      - name: Test
        working-directory: contracts
        run: forge test -vvv

      - name: Gas snapshot
        working-directory: contracts
        run: |
          # Fails if any test's gas moves by more than the tolerance, so a
          # change that quietly makes the revoke path more expensive gets
          # noticed. The revoke is a race against a drainer; gas is not cosmetic.
          forge snapshot --check .gas-snapshot --tolerance 1 || {
            echo "::warning::gas changed beyond tolerance — run 'forge snapshot' and commit"
            forge snapshot --snap /tmp/new.snap >/dev/null 2>&1
            diff .gas-snapshot /tmp/new.snap || true
            exit 1
          }

      - name: Slither static analysis
        uses: crytic/slither-action@f197989dea5b53e986d0f88c60a034ddd77ec9a8 # v0.4.0
        with:
          target: contracts
          slither-args: --exclude-dependencies --fail-high
          fail-on: high

      - name: Coverage must stay at 100%
        working-directory: contracts
        run: |
          # This Foundry build has no --fail-under, so assert on the summary.
          # The contracts are small and security-relevant; anything less than
          # full branch coverage means an untested failure path.
          forge coverage --report summary | tee coverage.txt
          # --- BEGIN COVERAGE GATE (extracted verbatim by test/ci-workflow.test.ts) ---
          # The previous gate was one line:
          #
          #   grep -E '^\| (src/|Total)' coverage.txt | grep -qv '100.00%'
          #
          # and it failed open in two independent ways, both of which shipped.
          #
          # 1. It asserted NOTHING against a summary it could not parse. Change
          #    the table format and the first grep matches no rows, `grep -qv`
          #    on empty input exits 1, the `if` is false, and the step prints
          #    "Solidity coverage: 100%" and goes green.
          # 2. `grep -v '100.00%'` is a substring test over the WHOLE ROW, and
          #    a row has four percentages on it. A contract at 100% lines /
          #    statements / functions and 50% BRANCHES still contains the string
          #    "100.00%", so it was never selected and the gate passed — at 50%
          #    branch coverage, on a security-relevant contract, which is
          #    precisely the untested failure path this gate exists to catch.
          #
          # So: the shape of the table is checked before its contents, and the
          # contents are checked cell by cell rather than by substring.
          #
          # The file's existence is checked first and separately. With no
          # coverage.txt at all, `grep -c` prints nothing, both counts end up
          # as empty strings, and `[ "" -eq 0 ]` fails as a syntax error inside
          # an `if` condition — where `set -e` does not apply — so the gate
          # would fall through and pass. Same fail-open, third route in.
          if [ ! -f coverage.txt ]; then
            echo "::error::forge coverage wrote no summary file — the gate has nothing to assert on."
            exit 1
          fi
          src_rows=$(grep -cE '^\| src/' coverage.txt || true)
          total_rows=$(grep -cE '^\| Total' coverage.txt || true)
          if [ "$src_rows" -eq 0 ] || [ "$total_rows" -ne 1 ]; then
            echo "::error::Unrecognised forge coverage summary — the 100% gate matched no rows and asserted nothing. Fix the parser, do not delete the gate."
            echo "expected: one or more lines starting '| src/', and exactly one starting '| Total'"
            echo "found:    ${src_rows} src rows, ${total_rows} total rows"
            echo "--- forge coverage --report summary ---"
            cat coverage.txt
            exit 1
          fi
          # Prints any row carrying a percentage cell that is not exactly
          # 100.00%. Every cell on the row is examined; one short metric is
          # enough to select it.
          below=$(grep -E '^\| (src/|Total)' coverage.txt | awk -F'|' '
            {
              for (i = 1; i <= NF; i++) {
                cell = $i
                gsub(/^[ \t]+|[ \t]+$/, "", cell)
                if (cell ~ /%/ && cell !~ /^100\.00%/) { print; next }
              }
            }')
          if [ -n "$below" ]; then
            echo "::error::Solidity coverage dropped below 100%"
            printf '%s\n' "$below"
            exit 1
          fi
          echo "Solidity coverage: 100% across ${src_rows} contract(s) — lines / statements / branches / functions"
          # --- END COVERAGE GATE ---

  # Everything above must pass before the branch is considered shippable.
  # Note on scope: the on-chain integration proof (`pnpm spike`, `pnpm seed`,
  # `pnpm bench`) is deliberately NOT run here. It needs a funded wallet and an
  # organisation API key, and running it on every PR would spend real gas and
  # leak credentials into CI. It is reproduced manually — see DEMO.md.
  e2e:
    name: E2E — pages · responsive
    runs-on: ubuntu-latest
    # Gated on quality because it is the cheapest signal and shares the same
    # dependency install. A broken lockfile or a type error would otherwise fail
    # here too, three minutes later and less legibly.
    needs: [quality]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Only chromium. These specs assert content and layout, not engine
      # differences, so the other two browsers would triple install time to
      # re-prove the same thing.
      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E
        run: pnpm e2e

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  perf:
    name: Perf — Lighthouse budgets
    runs-on: ubuntu-latest
    # Gated on quality because it is the cheapest signal and shares the same
    # dependency install. A broken lockfile or a type error would otherwise fail
    # here too, three minutes later and less legibly.
    needs: [quality]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Asserts the accessibility and SEO budgets in lighthouserc.json. The
      # a11y audits are hard errors rather than warnings: this gate exists
      # because a link-contrast regression and a dimmed HUD element both shipped
      # unnoticed, and both are exactly what these audits catch.
      - name: Lighthouse
        run: pnpm lighthouse

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: .lighthouseci/
          retention-days: 7

  submission:
    name: Submission readiness — placeholders · links · assets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Deliberately dependency-free and un-gated: the script is bash, grep and
    # `git ls-files`, so it needs neither a node_modules nor any other job to
    # have passed, and a judge-facing README that links FILL_YOUTUBE_URL is
    # worth knowing about even on a run where the tests are red.
    #
    # It runs on a bare checkout ON PURPOSE. The placeholder scan walks the
    # working tree, and coverage/, .lighthouseci/ and playwright-report/ are
    # full of generated HTML; running this before any job could drop artifacts
    # in the tree is what keeps the result a property of the repository rather
    # than of whatever ran first.
    #
    # A hard gate, not a warning. Every check in it is deterministic — file
    # existence, tracked-ness, and greps over committed text — with no network,
    # no clock and no credentials, so it cannot flake; and the failure it
    # catches is one that only ever shows up on submission day, when there is
    # no time left to fix it.
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Via the package script rather than `bash scripts/...` so the command a
      # maintainer runs locally and the command CI runs are the same string.
      # This script existed, passed, and was wired into nothing for its whole
      # life — a check that never runs is documentation with a shebang.
      - name: Submission readiness
        run: pnpm check:submission

  gate:
    name: Ready to ship
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [quality, security, contracts, e2e, perf, submission]
    steps:
      - run: echo "quality, security, contract, e2e, perf and submission suites all green"
