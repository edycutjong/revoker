name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so a newly-published advisory is caught even with no commits.
    - cron: '27 4 * * 1'

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Code scanning is free on public repositories but needs GitHub Advanced
    # Security on private ones. While this repo is private the analysis runs
    # fine and only the upload fails, which surfaces as a red X that means
    # nothing. Skip rather than fail; this starts running by itself the moment
    # the repo goes public.
    if: github.event.repository.private != true
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          language: ${{ matrix.language }}
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
