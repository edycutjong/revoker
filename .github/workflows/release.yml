name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Semantic version
    runs-on: ubuntu-latest
    steps:
      # release-please derives the next semver from Conventional Commits since
      # the last release, opens a release PR with generated notes, and cuts the
      # tag + GitHub Release when that PR merges.
      #
      # Note on this repo's history: the first 20 commits are deliberately
      # prose, not `feat:`/`fix:` prefixed — commit messages here are written to
      # be read. release-please will simply find nothing to release from them,
      # which is correct rather than broken. It takes over from the first
      # conventional commit onward; see CONTRIBUTING.md.
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        id: release
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

      # Fully automatic releases: queue the release PR to merge itself once its
      # checks pass. Auto-merge respects branch protection and required checks,
      # so this does not bypass CI — it merges when CI is green and not before.
      # Without this the version only moves when a human remembers to click.
      - name: Auto-merge the release PR
        if: ${{ steps.release.outputs.prs_created == 'true' || steps.release.outputs.pr }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # This job never checks out, so `gh` has no git remote to infer from
          # and fails with "not a git repository". Pass --repo explicitly rather
          # than adding a checkout just to give the CLI somewhere to stand.
          REPO="${{ github.repository }}"
          NUM=$(echo '${{ steps.release.outputs.pr }}' \
            | python3 -c 'import sys,json;print(json.load(sys.stdin).get("number",""))' 2>/dev/null || true)
          if [ -z "$NUM" ]; then
            NUM=$(gh pr list --repo "$REPO" --state open \
              --search "release-please in:title" --json number -q '.[0].number' 2>/dev/null || true)
          fi
          if [ -n "$NUM" ]; then
            gh pr merge "$NUM" --repo "$REPO" --squash --auto \
              && echo "auto-merge queued on #$NUM"
          else
            echo "no open release PR — nothing to queue"
          fi
