name: Diag

# TEMPORARY. Round 2: round 1 proved that test/audit.test.ts is the file that
# never finishes in CI (the other three always report; audit never does, with or
# without coverage, in either pool). This round isolates which `it()` inside it
# hangs, and whether it is the /proc case.
#
# Delete this file once the root cause is fixed.

on:
  push:
    branches: [ci/diagnose-hang]
  workflow_dispatch:

jobs:
  diag:
    name: Which test hangs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Environment facts the test depends on
        run: |
          set +e
          echo "whoami: $(whoami)  uid=$(id -u)"
          echo "--- is /proc a real procfs? ---"
          stat -f -c '%T' /proc
          echo "--- can we mkdir -p under /proc? ---"
          mkdir -p /proc/definitely/not/writable 2>&1; echo "mkdir exit=$?"
          echo "--- node doing exactly what audit.ts does ---"
          timeout -v -s KILL 20 node -e '
            const {mkdirSync,appendFileSync}=require("fs");
            const p="/proc/definitely/not/writable/x.jsonl";
            const t=Date.now();
            try{ mkdirSync(require("path").dirname(p),{recursive:true}); appendFileSync(p,"x\n"); }
            catch(e){ console.log("threw:", e.code); }
            console.log("elapsed_ms:", Date.now()-t);
          '
          echo "node exit=$?"

      - name: audit.test.ts ALONE, verbose — which it() hangs
        run: |
          set +e
          timeout -v -s KILL 90 node_modules/.bin/vitest run test/audit.test.ts \
            --reporter=verbose --no-color --no-file-parallelism
          echo "::notice::audit-alone exit=$?"

      - name: The other three together (control)
        run: |
          set +e
          timeout -v -s KILL 90 node_modules/.bin/vitest run \
            test/keeperhub.test.ts test/rules.test.ts test/revoke.test.ts \
            --reporter=verbose --no-color
          echo "::notice::others exit=$?"
