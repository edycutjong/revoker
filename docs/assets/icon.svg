<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Revoker mark: an allowance ring severed to zero by the revoke stroke">
  <defs>
    <linearGradient id="ringGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="var(--primary, #4ea1ff)"/>
      <stop offset="100%" stop-color="var(--accent, #6fd6ff)"/>
    </linearGradient>
    <radialGradient id="plateGlow" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0%" stop-color="var(--primary, #4ea1ff)" stop-opacity="0.16"/>
      <stop offset="55%" stop-color="var(--primary, #4ea1ff)" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="var(--primary, #4ea1ff)" stop-opacity="0"/>
    </radialGradient>
    <!-- corridor: removes the ring where the revoke stroke passes -->
    <mask id="sever">
      <rect x="0" y="0" width="512" height="512" fill="#fff"/>
      <line x1="132" y1="380" x2="380" y2="132" stroke="#000" stroke-width="104" stroke-linecap="round"/>
    </mask>
  </defs>

  <!-- plate -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="var(--icon-plate, #12161d)"/>
  <rect x="17.5" y="17.5" width="477" height="477" rx="102.5" fill="none" stroke="var(--icon-line, #2b3442)" stroke-width="3"/>
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#plateGlow)"/>

  <!-- the allowance ring (the 0), severed -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#ringGrad)" stroke-width="60" mask="url(#sever)"/>

  <!-- the revoke stroke -->
  <line x1="132" y1="380" x2="380" y2="132" stroke="var(--icon-stroke, #e6e9ef)" stroke-width="46" stroke-linecap="round"/>
</svg>
