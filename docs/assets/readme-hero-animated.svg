      <g class="seal">
        <rect x="830" y="94" width="170" height="64" rx="12" fill="#12161d"/>
        <rect x="830" y="94" width="170" height="64" rx="12" fill="#35d07f" fill-opacity="0.10" stroke="#35d07f" stroke-opacity="0.6"/>
        <text class="mono" x="915" y="127" font-size="25" font-weight="700" letter-spacing="-0.5" fill="#35d07f" text-anchor="middle">TOOK 0</text>
        <text class="mono" x="915" y="146" font-size="10.5" fill="#8b94a4" text-anchor="middle">10,000 mUSDC intact</text>
      </g>

      <!-- caption line: the four beats, in words -->
      <g class="mono" font-size="12.5" text-anchor="middle">
        <text x="915" y="299" fill="#8b94a4" opacity="0">approve(spender, MAX_UINT256) &#8212; allowance unlimited<animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.06;0.08;0.22;0.24;1"/></text>
        <text x="915" y="299" fill="#ff5c5c" opacity="0">2 threat rules fired &#8212; no human in the loop<animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.25;0.27;0.42;0.44;1"/></text>
        <text x="915" y="299" fill="#ffb547" opacity="0">approve(spender, 0) &#8212; atomic check-and-execute<animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.46;0.48;0.62;0.64;1"/></text>
        <text x="915" y="299" fill="#35d07f" opacity="0">drain fired anyway &#8212; took 0 &#183; funds untouched<animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.66;0.68;1"/></text>
      </g>
    </g>
