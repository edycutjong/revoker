      <circle cx="915" cy="135" r="8" fill="none" stroke="#35d07f" stroke-width="2" opacity="0">
        <animate attributeName="r" dur="8s" repeatCount="indefinite" values="8;8;46;46" keyTimes="0;0.72;0.785;1"/>
        <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;0.85;0;0" keyTimes="0;0.72;0.735;0.785;1"/>
