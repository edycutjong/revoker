<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img"
     aria-label="Revoker — the agent that lands the revoke before the drainer moves. A wallet grants an unlimited approval, two threat rules fire, the agent zeroes the allowance through KeeperHub, and the drainer fires anyway and takes nothing.">
  <style>
    .sans { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .metric { animation: mpulse 8s ease-in-out infinite; }
    @keyframes mpulse { 0%, 100% { opacity: 0.7; } 50% { opacity: 1; } }
    .aur1 { animation: drift1 16s ease-in-out infinite alternate; }
    .aur2 { animation: drift2 19s ease-in-out infinite alternate; }
    @keyframes drift1 { from { transform: translate(0, 0); } to { transform: translate(70px, 26px); } }
    @keyframes drift2 { from { transform: translate(0, 0); } to { transform: translate(-80px, -20px); } }
    .spender-g { transform-box: fill-box; transform-origin: center; animation: glitch 8s steps(2, end) infinite; }
    @keyframes glitch {
      0%, 24% { transform: translate(0, 0); }
      25% { transform: translate(-1.5px, 1px); }
      26% { transform: translate(1.5px, -1px); }
      27% { transform: translate(-1px, -1px); }
      28% { transform: translate(1px, 1px); }
      29%, 100% { transform: translate(0, 0); }
    }
    .chip1 { opacity: 0; transform-box: fill-box; transform-origin: center; animation: pop1 8s linear infinite; }
    @keyframes pop1 {
      0%, 25% { opacity: 0; transform: scale(0.6); }
      27.5% { opacity: 1; transform: scale(1.08); }
      29%, 96% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(1); }
    }
    .chip2 { opacity: 0; transform-box: fill-box; transform-origin: center; animation: pop2 8s linear infinite; }
    @keyframes pop2 {
      0%, 30% { opacity: 0; transform: scale(0.6); }
      32.5% { opacity: 1; transform: scale(1.08); }
      34%, 96% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(1); }
    }
    .seal { opacity: 0; transform-box: fill-box; transform-origin: center; animation: sealpop 8s linear infinite; }
    @keyframes sealpop {
      0%, 77% { opacity: 0; transform: scale(0.5) rotate(-4deg); }
      80% { opacity: 1; transform: scale(1.07) rotate(1.5deg); }
      82%, 96% { opacity: 1; transform: scale(1) rotate(0deg); }
      100% { opacity: 0; transform: scale(1) rotate(0deg); }
    }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <defs>
    <linearGradient id="wg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4ea1ff"/><stop offset="100%" stop-color="#6fd6ff"/>
    </linearGradient>
    <linearGradient id="rg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#4ea1ff"/><stop offset="100%" stop-color="#6fd6ff"/>
    </linearGradient>
    <radialGradient id="aur1g"><stop offset="0%" stop-color="#4ea1ff" stop-opacity="0.10"/><stop offset="100%" stop-color="#4ea1ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="aur2g"><stop offset="0%" stop-color="#6fd6ff" stop-opacity="0.08"/><stop offset="100%" stop-color="#6fd6ff" stop-opacity="0"/></radialGradient>
    <linearGradient id="beamg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e6e9ef" stop-opacity="0"/>
      <stop offset="50%" stop-color="#e6e9ef" stop-opacity="0.055"/>
      <stop offset="100%" stop-color="#e6e9ef" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#e6e9ef" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
    <clipPath id="plateClip"><rect x="1" y="1" width="1278" height="318" rx="15"/></clipPath>
    <clipPath id="wmClip">
      <path transform="translate(114,96) scale(0.9)" d="M12.7 0L4.2 0L4.2-44.8L23.7-44.8Q27.9-44.8 31-43.3Q34.2-41.9 35.9-39.2Q37.6-36.5 37.6-32.8L37.6-32.1Q37.6-28 35.7-25.5Q33.8-23 31-21.9L31-20.7Q33.5-20.6 34.9-19Q36.4-17.3 36.4-14.7L36.4 0L27.9 0L27.9-13.4Q27.9-15 27.1-15.9Q26.3-16.9 24.4-16.9L12.7-16.9L12.7 0M12.7-37.1L12.7-24.6L22.8-24.6Q25.8-24.6 27.5-26.2Q29.2-27.8 29.2-30.5L29.2-31.2Q29.2-33.9 27.5-35.5Q25.9-37.1 22.8-37.1L12.7-37.1M59.4 0.9Q54.7 0.9 51-1.1Q47.4-3.1 45.4-6.8Q43.4-10.5 43.4-15.5L43.4-16.3Q43.4-21.2 45.4-24.9Q47.4-28.6 50.9-30.6Q54.5-32.6 59.3-32.6Q63.9-32.6 67.4-30.6Q70.8-28.5 72.8-24.8Q74.7-21.1 74.7-16.3L74.7-13.5L51.6-13.5Q51.7-10.2 54-8.2Q56.3-6.1 59.6-6.1Q63-6.1 64.6-7.6Q66.2-9.1 67.1-10.9L73.7-7.4Q72.8-5.8 71.1-3.8Q69.4-1.9 66.6-0.5Q63.7 0.9 59.4 0.9M51.6-19.5L66.5-19.5Q66.2-22.3 64.3-23.9Q62.3-25.6 59.2-25.6Q55.9-25.6 54-23.9Q52.1-22.3 51.6-19.5M100.4 0L87.6 0L77.5-31.7L86.1-31.7L93.4-5.9L94.6-5.9L102-31.7L110.5-31.7L100.4 0M130.2 0.9Q125.5 0.9 121.7-1Q118-2.9 115.8-6.6Q113.6-10.2 113.6-15.4L113.6-16.4Q113.6-21.5 115.8-25.2Q118-28.8 121.7-30.7Q125.5-32.6 130.2-32.6Q135-32.6 138.8-30.7Q142.5-28.8 144.7-25.2Q146.9-21.5 146.9-16.4L146.9-15.4Q146.9-10.2 144.7-6.6Q142.5-2.9 138.8-1Q135 0.9 130.2 0.9M130.2-6.3Q134-6.3 136.4-8.7Q138.8-11.1 138.8-15.6L138.8-16.2Q138.8-20.7 136.4-23.1Q134-25.5 130.2-25.5Q126.5-25.5 124.1-23.1Q121.7-20.7 121.7-16.2L121.7-15.6Q121.7-11.1 124.1-8.7Q126.5-6.3 130.2-6.3M162.4 0L154.3 0L154.3-44.8L162.4-44.8L162.4-20L163.5-20L174-31.7L184.5-31.7L169.9-16.4L185 0L174.7 0L163.5-12.6L162.4-12.6L162.4 0M202.9 0.9Q198.2 0.9 194.6-1.1Q191-3.1 189-6.8Q186.9-10.5 186.9-15.5L186.9-16.3Q186.9-21.2 188.9-24.9Q190.9-28.6 194.5-30.6Q198.1-32.6 202.8-32.6Q207.5-32.6 210.9-30.6Q214.4-28.5 216.3-24.8Q218.2-21.1 218.2-16.3L218.2-13.5L195.1-13.5Q195.3-10.2 197.6-8.2Q199.9-6.1 203.2-6.1Q206.6-6.1 208.2-7.6Q209.8-9.1 210.6-10.9L217.2-7.4Q216.3-5.8 214.6-3.8Q212.9-1.9 210.1-0.5Q207.3 0.9 202.9 0.9M195.2-19.5L210-19.5Q209.8-22.3 207.8-23.9Q205.9-25.6 202.8-25.6Q199.5-25.6 197.6-23.9Q195.6-22.3 195.2-19.5"/>
      <path transform="translate(114,96) scale(0.9) translate(220.9,0)" d="M12.5 0L4.5 0L4.5-31.7L12.4-31.7L12.4-28.2L13.6-28.2Q14.3-30.1 15.9-31Q17.5-31.9 19.7-31.9L23.6-31.9L23.6-24.7L19.6-24.7Q16.5-24.7 14.5-23.1Q12.5-21.4 12.5-18"/>
    </clipPath>
    <filter id="soft" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="2.6"/>
    </filter>
    <mask id="miniSever">
      <rect x="0" y="0" width="512" height="512" fill="#fff"/>
      <line x1="126" y1="386" x2="386" y2="126" stroke="#000" stroke-width="86" stroke-linecap="round"/>
    </mask>
  </defs>

  <!-- ============ backdrop ============ -->
  <rect x="0.5" y="0.5" width="1279" height="319" rx="16" fill="#0a0c10" stroke="#1e242e"/>
  <g clip-path="url(#plateClip)">
    <rect x="0" y="0" width="1280" height="320" fill="url(#grid)"/>
    <circle class="aur1" cx="210" cy="50" r="220" fill="url(#aur1g)"/>
    <circle class="aur2" cx="1080" cy="290" r="240" fill="url(#aur2g)"/>
    <g transform="skewX(-18)">
      <rect y="-40" width="150" height="400" fill="url(#beamg)">
        <animate attributeName="x" dur="8s" repeatCount="indefinite" values="-300;-300;1560;1560" keyTimes="0;0.34;0.52;1"/>
        <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.34;0.36;0.50;0.52;1"/>
      </rect>
    </g>

    <!-- ============ left: brand ============ -->
    <g>
      <!-- mini mark: the severed-zero -->
      <g transform="translate(50,52) scale(0.09375)">
        <rect x="16" y="16" width="480" height="480" rx="104" fill="#12161d"/>
        <rect x="17.5" y="17.5" width="477" height="477" rx="102.5" fill="none" stroke="#1e242e" stroke-width="6"/>
        <circle cx="256" cy="256" r="136" fill="none" stroke="url(#rg)" stroke-width="56" mask="url(#miniSever)"/>
        <line x1="136" y1="376" x2="376" y2="136" stroke="#e6e9ef" stroke-width="40" stroke-linecap="round"/>
      </g>
      <!-- outlined wordmark (Space Grotesk 700 → vector paths, opentype.js) -->
      <g>
        <path fill="#e6e9ef" transform="translate(114,96) scale(0.9)" d="M12.7 0L4.2 0L4.2-44.8L23.7-44.8Q27.9-44.8 31-43.3Q34.2-41.9 35.9-39.2Q37.6-36.5 37.6-32.8L37.6-32.1Q37.6-28 35.7-25.5Q33.8-23 31-21.9L31-20.7Q33.5-20.6 34.9-19Q36.4-17.3 36.4-14.7L36.4 0L27.9 0L27.9-13.4Q27.9-15 27.1-15.9Q26.3-16.9 24.4-16.9L12.7-16.9L12.7 0M12.7-37.1L12.7-24.6L22.8-24.6Q25.8-24.6 27.5-26.2Q29.2-27.8 29.2-30.5L29.2-31.2Q29.2-33.9 27.5-35.5Q25.9-37.1 22.8-37.1L12.7-37.1M59.4 0.9Q54.7 0.9 51-1.1Q47.4-3.1 45.4-6.8Q43.4-10.5 43.4-15.5L43.4-16.3Q43.4-21.2 45.4-24.9Q47.4-28.6 50.9-30.6Q54.5-32.6 59.3-32.6Q63.9-32.6 67.4-30.6Q70.8-28.5 72.8-24.8Q74.7-21.1 74.7-16.3L74.7-13.5L51.6-13.5Q51.7-10.2 54-8.2Q56.3-6.1 59.6-6.1Q63-6.1 64.6-7.6Q66.2-9.1 67.1-10.9L73.7-7.4Q72.8-5.8 71.1-3.8Q69.4-1.9 66.6-0.5Q63.7 0.9 59.4 0.9M51.6-19.5L66.5-19.5Q66.2-22.3 64.3-23.9Q62.3-25.6 59.2-25.6Q55.9-25.6 54-23.9Q52.1-22.3 51.6-19.5M100.4 0L87.6 0L77.5-31.7L86.1-31.7L93.4-5.9L94.6-5.9L102-31.7L110.5-31.7L100.4 0M130.2 0.9Q125.5 0.9 121.7-1Q118-2.9 115.8-6.6Q113.6-10.2 113.6-15.4L113.6-16.4Q113.6-21.5 115.8-25.2Q118-28.8 121.7-30.7Q125.5-32.6 130.2-32.6Q135-32.6 138.8-30.7Q142.5-28.8 144.7-25.2Q146.9-21.5 146.9-16.4L146.9-15.4Q146.9-10.2 144.7-6.6Q142.5-2.9 138.8-1Q135 0.9 130.2 0.9M130.2-6.3Q134-6.3 136.4-8.7Q138.8-11.1 138.8-15.6L138.8-16.2Q138.8-20.7 136.4-23.1Q134-25.5 130.2-25.5Q126.5-25.5 124.1-23.1Q121.7-20.7 121.7-16.2L121.7-15.6Q121.7-11.1 124.1-8.7Q126.5-6.3 130.2-6.3M162.4 0L154.3 0L154.3-44.8L162.4-44.8L162.4-20L163.5-20L174-31.7L184.5-31.7L169.9-16.4L185 0L174.7 0L163.5-12.6L162.4-12.6L162.4 0M202.9 0.9Q198.2 0.9 194.6-1.1Q191-3.1 189-6.8Q186.9-10.5 186.9-15.5L186.9-16.3Q186.9-21.2 188.9-24.9Q190.9-28.6 194.5-30.6Q198.1-32.6 202.8-32.6Q207.5-32.6 210.9-30.6Q214.4-28.5 216.3-24.8Q218.2-21.1 218.2-16.3L218.2-13.5L195.1-13.5Q195.3-10.2 197.6-8.2Q199.9-6.1 203.2-6.1Q206.6-6.1 208.2-7.6Q209.8-9.1 210.6-10.9L217.2-7.4Q216.3-5.8 214.6-3.8Q212.9-1.9 210.1-0.5Q207.3 0.9 202.9 0.9M195.2-19.5L210-19.5Q209.8-22.3 207.8-23.9Q205.9-25.6 202.8-25.6Q199.5-25.6 197.6-23.9Q195.6-22.3 195.2-19.5"/>
        <path fill="url(#wg)" transform="translate(114,96) scale(0.9) translate(220.9,0)" d="M12.5 0L4.5 0L4.5-31.7L12.4-31.7L12.4-28.2L13.6-28.2Q14.3-30.1 15.9-31Q17.5-31.9 19.7-31.9L23.6-31.9L23.6-24.7L19.6-24.7Q16.5-24.7 14.5-23.1Q12.5-21.4 12.5-18"/>
        <!-- shimmer sweep under the wordmark clip -->
        <g clip-path="url(#wmClip)">
          <rect y="44" width="46" height="60" fill="#ffffff" opacity="0.32" transform="skewX(-20)">
            <animate attributeName="x" dur="8s" repeatCount="indefinite" values="60;60;420;420" keyTimes="0;0.30;0.42;1"/>
          </rect>
        </g>
      </g>

      <text class="sans" x="50" y="146" font-size="17.5" fill="#8b94a4">The agent that lands the revoke</text>
      <text class="sans" x="50" y="171" font-size="17.5" fill="#8b94a4">before the drainer moves.</text>

      <text class="mono metric" x="50" y="222" font-size="15.5" font-weight="600" fill="#4ea1ff">12.95s median detect &#8594; revoke &#183; 25/25 cycles</text>
      <text class="mono" x="50" y="252" font-size="13" fill="#566070">TypeScript &#183; Solidity &#183; KeeperHub &#183; Sepolia</text>
    </g>

    <!-- ============ right: the story ============ -->
    <g>
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;0.02;0.96;1"/>

      <!-- wallet -->
      <rect x="600" y="96" width="150" height="78" rx="10" fill="#12161d">
        <animate attributeName="stroke" dur="8s" repeatCount="indefinite" values="#1e242e;#1e242e;#35d07f;#35d07f" keyTimes="0;0.79;0.83;1"/>
      </rect>
      <text class="mono" x="616" y="122" font-size="10.5" letter-spacing="1.5" fill="#566070">WALLET</text>
      <text class="mono" x="616" y="146" font-size="17" font-weight="700" fill="#e6e9ef">10,000</text>
      <text class="mono" x="616" y="163" font-size="11.5" fill="#8b94a4">mUSDC &#183; intact</text>

      <!-- spender / drainer -->
      <g class="spender-g">
        <rect x="1080" y="96" width="150" height="78" rx="10" fill="#12161d" stroke-width="1">
          <animate attributeName="stroke" dur="8s" repeatCount="indefinite" values="#1e242e;#1e242e;#ff5c5c;#ff5c5c" keyTimes="0;0.24;0.28;1"/>
        </rect>
        <text class="mono" x="1096" y="122" font-size="10.5" letter-spacing="1.5" fill="#566070">SPENDER</text>
        <text class="mono" x="1096" y="146" font-size="15" font-weight="700" fill="#e6e9ef">RoachMotel</text>
        <text class="mono" x="1096" y="163" font-size="11.5" fill="#8b94a4">drain contract</text>
      </g>

      <!-- threat rule chips -->
      <g class="chip1">
        <rect x="1012" y="190" width="196" height="25" rx="6" fill="#ff5c5c" fill-opacity="0.10" stroke="#ff5c5c" stroke-opacity="0.38"/>
        <text class="mono" x="1110" y="207" font-size="11.5" font-weight="700" fill="#ff5c5c" text-anchor="middle">unlimited-to-unverified</text>
      </g>
      <g class="chip2">
        <rect x="1048" y="223" width="124" height="25" rx="6" fill="#ff5c5c" fill-opacity="0.10" stroke="#ff5c5c" stroke-opacity="0.38"/>
        <text class="mono" x="1110" y="240" font-size="11.5" font-weight="700" fill="#ff5c5c" text-anchor="middle">young-spender</text>
      </g>

      <!-- allowance meter -->
      <text class="mono" x="946" y="66" font-size="12" text-anchor="end" fill="#566070">allowance:</text>
      <text class="mono" x="952" y="66" font-size="12.5" font-weight="700" fill="#ff5c5c" text-anchor="start" opacity="0">UNLIMITED<animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.16;0.18;0.56;0.585;1"/></text>
      <text class="mono" x="952" y="66" font-size="12.5" font-weight="700" fill="#35d07f" text-anchor="start" opacity="0">0<animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.60;0.62;1"/></text>
      <rect x="855" y="74" width="120" height="10" rx="3" fill="none" stroke="#2a3240"/>
      <rect x="856" y="75" height="8" rx="2">
        <animate attributeName="width" dur="8s" repeatCount="indefinite" values="0;0;118;118;0;0" keyTimes="0;0.12;0.18;0.555;0.60;1"/>
        <animate attributeName="fill" dur="8s" repeatCount="indefinite" values="#4ea1ff;#4ea1ff;#ff5c5c;#ff5c5c" keyTimes="0;0.24;0.28;1"/>
      </rect>

      <!-- allowance line: whole → severed -->
      <line x1="750" y1="135" x2="1080" y2="135" stroke="#2a3240" stroke-width="2">
        <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.545;0.555;1"/>
      </line>
      <g opacity="0">
        <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.545;0.555;1"/>
        <line x1="750" y1="135" x2="902" y2="135" stroke="#2a3240" stroke-width="2"/>
        <line x1="928" y1="135" x2="1080" y2="135" stroke="#2a3240" stroke-width="2" stroke-dasharray="4 6"/>
      </g>
      <!-- the revoke stroke at the cut -->
      <line x1="905" y1="149" x2="925" y2="121" stroke="#e6e9ef" stroke-width="3.5" stroke-linecap="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100">
        <animate attributeName="stroke-dashoffset" dur="8s" repeatCount="indefinite" values="100;100;0;0" keyTimes="0;0.53;0.57;1"/>
      </line>

      <!-- agent -->
      <g transform="translate(887,200) scale(0.109375)">
        <rect x="16" y="16" width="480" height="480" rx="104" fill="#12161d"/>
        <rect x="17.5" y="17.5" width="477" height="477" rx="102.5" fill="none" stroke="#1e242e" stroke-width="6"/>
        <circle cx="256" cy="256" r="136" fill="none" stroke="url(#rg)" stroke-width="56" mask="url(#miniSever)"/>
        <line x1="136" y1="376" x2="376" y2="136" stroke="#e6e9ef" stroke-width="40" stroke-linecap="round"/>
      </g>
      <text class="mono" x="915" y="274" font-size="11" text-anchor="middle" fill="#566070">agent &#183; watching every block</text>
      <!-- agent fire pulse -->
      <circle cx="915" cy="228" r="30" fill="none" stroke="#ffb547" stroke-width="1.5" opacity="0">
        <animate attributeName="r" dur="8s" repeatCount="indefinite" values="26;26;52;52" keyTimes="0;0.44;0.50;1"/>
        <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;0.9;0;0" keyTimes="0;0.44;0.455;0.50;1"/>
      </circle>

      <!-- beat 1: approval comet (wallet → spender) -->
      <g opacity="0">
        <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.05;0.06;0.12;0.135;1"/>
        <g>
          <animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.05;0.13;1" path="M750,135 L1080,135"/>
          <circle r="6" fill="#4ea1ff" filter="url(#soft)"/>
          <circle r="2.6" fill="#e6e9ef"/>
        </g>
      </g>

      <!-- beat 3: revoke comet (agent → the cut) -->
      <g opacity="0">
        <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.46;0.47;0.525;0.54;1"/>
        <g>
          <animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.46;0.53;1" path="M915,196 L915,140"/>
